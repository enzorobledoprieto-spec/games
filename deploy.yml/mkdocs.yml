site_name:README

theme: mkdocs
  name: material

nav:
  - Inici: index.md
  - Grups: groups.md
  # mkdocs.yml

  plugins:
    - search:
        type: search
    - blog:
        type: blog
    - tags:
        type: tags
    - social:
        type: social
        links:
          - type: github
            link: https://github.com/yourusername/yourrepo
    - optimize:
        type: optimize
        minify: true
    - offline:
        type: offline
        service_worker: true