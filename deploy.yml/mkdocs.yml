site_name:README

theme: mkdocs
  name: material

nav:
  - Inici: index.md
  - Grups: groups.md
  # mkdocs.yml

  plugins:
    - search
    - mkdocs-material
    - mkdocs-material:
        features:
          - navigation.instant
          - navigation.sections
          - navigation.top
          - search.highlight
          - search.suggest
    - mkdocs-minify-plugin         